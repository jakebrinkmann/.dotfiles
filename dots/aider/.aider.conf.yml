# --- Model Routing ---
# Default to the fast coder for standard edits
model: ollama/qwen2.5-coder:7b

# Architect mode should use the heavy reasoner
architect: true
editor-model: ollama/deepseek-r1:8b

# --- Memory Management ---
# Cap the repository map to prevent swap death on large repos
map-tokens: 2048

# --- Git & Workflow ---
# Auto-commit changes, but don't push
auto-commits: true
dry-run: false

# --- Custom Conventions ---
# Enforce our specific file header rule
message: |
  You are an expert software architect.
  ALWAYS follow these repository rules:
  1. Make the SMALLEST reasonable changes.
  2. All new code files MUST start with a brief 2-line comment explaining what the file does. Each line MUST start with "ABOUTME: " to make them easily greppable.
  3. Never use implementation details or temporal words ("New", "Legacy") in naming.
